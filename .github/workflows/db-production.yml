name: Base de données (production)

# Secours : les migrations sont normalement appliquées par le build Vercel de production.
# Déclenchement manuel uniquement : Actions → « Base de données (production) » → Run workflow.
# Secret requis dans GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_DB_URL = chaîne de connexion Postgres directe (non poolée) du projet Supabase de production.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrations et taxonomie (si base vide)
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.SUPABASE_DB_URL }}
          FORCE_MIGRATIONS: "1"
        run: node scripts/migrate-prod.mjs
